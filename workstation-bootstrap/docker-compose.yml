# NOTE: kv-backend already ships its own, authoritative local-services
# stack at <kv-backend>/preload-docker-compose/docker-compose.yml (MySQL
# 8.0.32 on :43306, RabbitMQ on :35672/:45672, Cassandra on :59042,
# Solr on :58983, Memcached on :41211, Tomcat/portal on :8080).
#
# This file intentionally defines no services of its own anymore — the
# previous placeholder stack (MySQL/MongoDB/Cassandra/RabbitMQ/Neo4j/
# nginx/Consul) did not match kv-backend's real ports, credentials, or
# images, and running both side by side only wastes resources and causes
# confusion.
#
# Use `make kv-up` / `make kv-init` / `make kv-verify` / `make kv-down`
# (backed by scripts/kv-backend.sh) to drive kv-backend's real stack
# instead. See README.md#kv-backend-local-environment.
name: workstation-bootstrap
services: {}
