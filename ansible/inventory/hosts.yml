---
# Ansible inventory for the developer VM.
#
# provision.sh passes -i 'ubuntu@<VM_IP>,' directly on the command line,
# so this file is used only when running ansible-playbook manually.
#
# To run the playbook manually after provisioning:
#
#   ansible-playbook \
#     -i "ubuntu@<VM_IP>," \
#     --private-key ~/.ssh/dev-env \
#     --extra-vars "dev_user=<your_username>" \
#     ansible/playbook.yml
#
all:
  hosts:
    dev-env:
      ansible_host: "{{ lookup('env', 'VM_IP') | default('127.0.0.1') }}"
      ansible_user: "{{ lookup('env', 'VM_SSH_USER') | default('ubuntu') }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'VM_SSH_KEY') | default('~/.ssh/dev-env') }}"
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      ansible_python_interpreter: /usr/bin/python3
  vars:
    dev_user: "{{ lookup('env', 'DEV_USER') | default('developer') }}"
