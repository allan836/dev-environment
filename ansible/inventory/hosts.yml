---
# Ansible inventory for the developer VM.
#
# When run via `vagrant ansible_local`, Vagrant automatically sets up the
# connection details so no IP/port config is needed here.
#
# When run directly (against a remote machine or a VM with a known IP):
#   ansible-playbook playbook.yml -i inventory/hosts.yml -u developer
all:
  hosts:
    dev-env:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
  vars:
    # Developer username inside the VM.
    # Overridden by provision.sh via --extra-vars 'dev_user=<name>'
    dev_user: vagrant
