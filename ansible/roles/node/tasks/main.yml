---
# =============================================================================
# Role: node
#
# Installs Node.js via nvm (Node Version Manager).
# Versions are read from group_vars/all/versions.yml.
#
# Installed Node versions: see node_versions var (default: 18, 20, 22)
# Default Node version:    see node_default var (default: 20)
# Also installs: pnpm
# =============================================================================

- name: Check if nvm is already installed
  ansible.builtin.stat:
    path: "{{ dev_home }}/.nvm/nvm.sh"
  register: nvm_sh
  become: false
  become_user: "{{ dev_user }}"

- name: Install nvm {{ nvm_version }}
  ansible.builtin.shell:
    cmd: "curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh | bash"
    executable: /bin/bash
  become: false
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  when: not nvm_sh.stat.exists

- name: Install Node.js versions {{ node_versions | join(', ') }}
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="{{ dev_home }}/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      {% for v in node_versions %}
      nvm install {{ v }} >/dev/null
      {% endfor %}
      nvm alias default {{ node_default }}
    executable: /bin/bash
  become: false
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"

- name: Install pnpm
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="{{ dev_home }}/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      if ! command -v pnpm >/dev/null 2>&1; then
        curl -fsSL https://get.pnpm.io/install.sh | sh -
      fi
    executable: /bin/bash
  become: false
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"

- name: Verify Node.js default version
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="{{ dev_home }}/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      node --version
    executable: /bin/bash
  become: false
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  register: node_version
  changed_when: false

- name: Print Node.js version
  ansible.builtin.debug:
    msg: "Node.js default: {{ node_version.stdout }}"
