---
# =============================================================================
# Developer Environment — Ansible Playbook
#
# Installs all developer tools inside the Ubuntu VM.
# Versions and configuration live in group_vars/all/versions.yml.
#
# Usage (run by provision.sh automatically, or manually):
#   ansible-playbook playbook.yml -i inventory/hosts.yml
#
# dev_user defaults to "ubuntu" — the Ubuntu cloud image's default user.
# The host username must never be substituted here.
#
# Run specific roles only:
#   ansible-playbook playbook.yml -i inventory/hosts.yml --tags java,tomcat
# =============================================================================
- name: Developer Workstation — Full Provision
  hosts: all
  become: true
  gather_facts: true

  vars:
    dev_user: "{{ dev_user | default('ubuntu') }}"
    dev_home: "/home/{{ dev_user }}"

  pre_tasks:
    - name: Ensure apt cache is fresh
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure workspace directory exists
      ansible.builtin.file:
        path: "{{ dev_home }}/workspace/repos"
        state: directory
        owner: "{{ dev_user }}"
        group: "{{ dev_user }}"
        mode: "0755"

  roles:
    - role: docker
      tags: [docker]

    - role: java
      tags: [java, runtimes]

    - role: tomcat
      tags: [tomcat, kv-backend]

    - role: node
      tags: [node, runtimes]

    - role: python
      tags: [python, runtimes]

    - role: terraform
      tags: [terraform, iac]

    - role: kubectl
      tags: [kubectl, kubernetes, k8s]

    - role: cloud_clis
      tags: [cloud, aws, azure, gcp]

    - role: developer_tools
      tags: [tools, git]

    - role: kv_backend
      tags: [kv, kv-backend]

  post_tasks:
    - name: Print provisioning summary
      ansible.builtin.debug:
        msg:
          - "Provisioning complete."
          - "Java 8 and Java 17 installed. Default: Java 17."
          - "Switch Java: sudo update-alternatives --config java"
          - "Tomcat 9 installed and running at {{ tomcat_install_dir }}."
          - "Next: ssh into VM → cd ~/dev-environment/workstation-bootstrap → make kv-up"
